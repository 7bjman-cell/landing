<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신청 완료 — 방음렌탈 스튜디오 실전창업</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 30px rgba(0,0,0,0.08);
    }
    .check {
      width: 80px;
      height: 80px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 40px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #1a2744;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    h1 span { color: #e63946; }
    p {
      font-size: 16px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .highlight {
      background: #fff8e1;
      border-left: 4px solid #ffd166;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 24px 0;
      text-align: left;
      font-size: 15px;
      color: #333;
      line-height: 1.7;
    }
    .btn {
      display: inline-block;
      margin-top: 28px;
      background: #e63946;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 50px;
      text-decoration: none;
    }
    .btn:hover { background: #c0303b; }
    .author {
      margin-top: 36px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>신청이 완료됐습니다!<br><span>감사합니다 🎉</span></h1>
    <p>입력하신 이메일로 <strong>무료 전자책</strong>을 보내드립니다.</p>

    <div class="highlight">
      📬 메일이 안 보이시면 <strong>스팸함</strong>도 확인해 주세요.<br>
      보통 <strong>수 분 내</strong>로 발송됩니다.
    </div>

    <p>방음렌탈 스튜디오 창업에 대해<br>궁금한 점이 있으시면 언제든지 문의해 주세요.</p>

    <a href="https://7bjman-cell.github.io/landing/" class="btn">← 랜딩페이지로 돌아가기</a>

    <p class="author">— 제이맨, 방음공간대여 창업 전문가</p>
  </div>
</body>
</html>
